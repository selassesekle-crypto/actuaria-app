# ActuarIA — Plan de tarification TRANSPORT DE MARCHANDISES (assurance cargo /
# marchandises transportees). LoB INEDITE : le moteur ne l'a JAMAIS vue, aucune
# ligne de code ne la mentionne. Ce seul fichier doit suffire a la tarifer — LE
# test de verite du chantier declaratif (aucune ligne de core/ ni d'agent
# touchee). Plan signe, versionne, opposable.
lob: marchandises_transportees
version: "1.0"
auteur: "S. Sekle, IA"
exposition: exposition
cible_frequence: nb_sinistres
cible_cout: cout_total_sinistres
# Queue lourde possible (perte totale de gros lots de valeur) : gamma par defaut,
# l'ecretement de pipeline_complet borne les graves. lognormal/inverse_gaussienne
# declarables ici si la vraie donnee montre une queue qui le justifie.
famille_severite: gamma
facteurs:
  # valeur_marchandise — grandeur monetaire etalee sur plusieurs ordres de grandeur,
  # declaree en LOG (meme mecanisme que auto/valeur_venale, rcpro/ca_annuel_eur,
  # decennale/montant_travaux_eur : produit le brut ET log_valeur_marchandise ; le
  # GLM charge le signal sur le log, le brut est inerte). Pilote surtout la SEVERITE.
  # ⚠ PRIOR OUVERT (valeur -> FREQUENCE) : la verification synthetique injecte un
  # +freq MILD (attractivite au vol des marchandises de valeur). L'effet SEVERITE
  # est incontestable ; l'effet FREQUENCE est notre hypothese, A CONFIRMER sur vraie
  # donnee cargo (meme reserve que montant->frequence en decennale). Ne pas traiter
  # le synthetique comme une preuve.
  - {nom: valeur_marchandise, type: continu, transformation: log}
  # mode_transport — NOMINAL : profils de peril distincts (mer=mouille/avarie
  # commune, air=vol/valeur, route=accident/vol), aucun axe monotone -> one_hot.
  # ⚠ PRIOR OUVERT (ordre de FREQUENCE des modes) : la verification synthetique
  # injecte Routier=baseline, Maritime au-dessus, Aerien en dessous. Mais le VOL
  # ROUTIER est un driver de sinistralite MAJEUR en transport reel : l'ordre vrai
  # des frequences par mode peut NE PAS refleter cet ordre injecte. A CONFIRMER sur
  # vraie donnee marche (les relativites one-hot recouvrees ne valent que sur le
  # portefeuille synthetique).
  - nom: mode_transport
    type: categoriel
    encodage: one_hot
    modalites: [Routier, Maritime, Aerien]
    reference: Routier
  # zone_destination — ordre de risque plausible (UE<Hors_UE<Zone_risque) mais pas
  # de pas uniforme -> one_hot (chaque zone sa relativite, plus sur que label).
  - nom: zone_destination
    type: categoriel
    encodage: one_hot
    modalites: [UE, Hors_UE, Zone_risque]
    reference: UE
  # nature_marchandise — NOMINALE, one_hot OBLIGATOIRE. Lecon csp/secteur_activite
  # (2026-07) : risque multi-dimensionnel NON-monotone (electronique=vol,
  # perissable=avarie/delai, dangereuse=catastrophe, fragile=casse). Un label
  # ajusterait UNE pente sur des codes arbitraires et ECRASERAIT/INVERSERAIT le
  # signal. One_hot = chaque nature sa relativite propre.
  - nom: nature_marchandise
    type: categoriel
    encodage: one_hot
    modalites: [General, Electronique, Perissable, Dangereuse, Fragile]
    reference: General
  # emballage — qualite d'emballage/conditionnement, un des tout premiers
  # predicteurs de DOMMAGE en transport. one_hot (ordinal defendable, one_hot plus sur).
  - nom: emballage
    type: categoriel
    encodage: one_hot
    modalites: [Standard, Renforce, Conteneur]
    reference: Standard
  # nb_expeditions_an — facteur de VOLUME. CONTRAT SEMANTIQUE (montage a) :
  # nb_sinistres est compte PAR ANNEE-POLICE et exposition = fraction d'annee-
  # police ; nb_expeditions_an est alors une CARACTERISTIQUE de risque (volume),
  # PAS la base d'exposition — sinon double-comptage avec exposition (parente B9).
  # Le garde-fou B9 ne bloque que la colonne 'exposition' declaree : ce choix est
  # ACTUARIEL, pas moteur.
  # DECLARE EN LOG (transformation:log) car le volume est ~PROPORTIONNEL (chaque
  # expedition ~ un tirage de risque). La verification synthetique (2026-07-15) l'a
  # montre sur la plage 5->500 : le LINEAIRE aplatit le bas (5->20 : x1,04 recouvre
  # vs x3,25 vrai) et sous-recouvre partout (5->500 : x6 vs x50) ; le LOG restitue
  # le milieu de plage quasi exactement (20->400 : x12,5 vs x12,8 vrai) et corrige
  # fortement le reste. Produit nb_expeditions_an ET log_nb_expeditions_an (le GLM
  # charge le signal sur le log ; meme mecanisme brut+log que les grandeurs monetaires).
  - {nom: nb_expeditions_an, type: continu, transformation: log}
  # sinistres_2ans_anterieurs — anteriorite legitime, connue a la souscription,
  # exemptee du controle par l'effet (comme les autres LoB).
  - {nom: sinistres_2ans_anterieurs, type: continu, anteriorite: true,
     commentaire: "Sinistralite des 2 dernieres annees — connue a la souscription"}

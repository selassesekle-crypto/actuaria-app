# ActuarIA — Plan de tarification DÉCENNALE (garantie décennale construction).
# LoB INCONNUE du moteur : aucune ligne de code ne la mentionne. Ce seul fichier
# suffit à la tarifer (test de vérité INV-9). Plan signé, versionné, opposable.
lob: decennale
version: "1.0"
auteur: "S. Sekle, IA"
exposition: exposition
# UNITE de l'exposition -- chantier `unite_exposition`, etape 5.
# 'annee' -> borne de plausibilite 1.0 : EXACTEMENT le comportement
# d'hier, mais DECLARE au lieu d'etre suppose. Valeur inconnue -> LEVE.
unite_exposition: annee
cible_frequence: nb_sinistres
cible_cout: cout_total_sinistres
# ══════════════════════════════════════════════════════════════════════════════
# ROLES DE DONNEES — declares le 30/08/2026 (chantier `plan/C7`).
# ⚠️ CE NE SONT PAS DES FACTEURS. Ils n'entrent JAMAIS dans
# `colonnes_produites()` et ne sont jamais modelises : ils servent au
# dedoublonnage de la couche qualite, et a rien d'autre.
#
# ⚠️ L'IDENTITE A DEDOUBLONNER EST A TRANCHER PAR FICHIER — l'OUVRAGE ou le contrat — arbitre par Selasse le 30/08/2026.
#   NUANCE ACTEE : en police unique de chantier (PUC) l'unite est l'OUVRAGE et
#   il n'y a PAS de renouvellement — `echeance` peut rester sans colonne. En
#   abonnement annuel, l'unite est le contrat et l'echeance s'applique.
#   4 facteurs sur 7 decrivent le chantier, 3 l'entreprise.
identifiant_contrat: id_contrat
#
# ⚠️ LA CLE COMPLETE EST (identifiant, echeance). Sans echeance, deux lignes de
# meme identifiant sont AMBIGUES — doublon, ou HISTORIQUE de renouvellement ?
# Mesure : un historique sur 3 exercices porte 66,7 % de faux doublons. Elles
# sont alors CONSERVEES et signalees, jamais exclues.
# ⚠️ Declarer la colonne ici ne l'exige pas du client : si elle est absente du
# fichier, le systeme le DIT et conserve les lignes. Mesure : aucune fausse
# amputation du plan.
echeance: date_echeance
# ══════════════════════════════════════════════════════════════════════════════
# Famille du GLM de coût moyen — déclarée, plus codée en dur (gamma par défaut).
famille_severite: gamma
facteurs:
  # ── montant_travaux_eur — grandeur monetaire, declaree en LOG ──────────────
  #  MECANISME brut+log IDENTIQUE a rcpro/ca_annuel_eur et auto/valeur_venale :
  #  transformation:log => colonnes_produites() emet DEUX colonnes, le brut
  #  (montant_travaux_eur) ET le log (log_montant_travaux_eur). Comportement
  #  VOULU du plan (meme code colonnes_produites(), aucune branche par LoB), pas
  #  un doublon accidentel. Le GLM charge le signal sur le LOG ; le brut ressort
  #  a coefficient ~0 (colinearite attendue variable/son-log) — colonne inerte,
  #  pas nuisible.
  #  ⚠ PRIOR OUVERT (montant -> FREQUENCE) : sur le portefeuille SYNTHETIQUE de
  #  reference, montant eleve => frequence ET severite plus hautes (notre
  #  hypothese). L'effet SEVERITE est incontestable ; l'effet FREQUENCE (nombre
  #  de sinistres par chantier) est un prior A CONFIRMER sur VRAIES donnees
  #  dommage-ouvrage — la taille pourrait ne jouer que sur la severite. Ne pas
  #  traiter le synthetique comme une preuve (meme reserve que MRH/RC Pro).
  - {nom: montant_travaux_eur,       type: continu, transformation: log}
  - {nom: nb_lots,                   type: continu}
  - {nom: anciennete_entreprise_ans, type: continu}
  - nom: type_ouvrage
    type: categoriel
    encodage: one_hot
    modalites: [Maison, Collectif, Tertiaire]
    reference: Maison
  - nom: qualification_entreprise
    type: categoriel
    encodage: one_hot
    modalites: [Qualibat, "Non qualifie"]
    reference: "Non qualifie"
  - nom: nature_marche
    type: categoriel
    encodage: label
    modalites: [Prive, Public]
  - {nom: sinistres_3ans_anterieurs, type: continu, anteriorite: true,
     commentaire: "Sinistralite des 3 dernieres annees — connue a la souscription"}

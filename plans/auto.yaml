# ActuarIA — Plan de tarification AUTO. Reproduit l'ancienne config codée en dur
# (VARS_GLM / VARS_CATEGORIELLES / INTERACTIONS) en UNE SEULE déclaration signée.
lob: auto
version: "1.0"
auteur: "S. Sekle, IA"
exposition: exposition
cible_frequence: nb_sinistres
cible_cout: cout_total_sinistres
# ══════════════════════════════════════════════════════════════════════════════
# ROLES DE DONNEES — declares le 30/08/2026 (chantier `plan/C7`).
# ⚠️ CE NE SONT PAS DES FACTEURS. Ils n'entrent JAMAIS dans
# `colonnes_produites()` et ne sont jamais modelises : ils servent au
# dedoublonnage de la couche qualite, et a rien d'autre.
#
# ⚠️ L'IDENTITE A DEDOUBLONNER EST le CONTRAT — arbitre par Selasse le 30/08/2026.
#   unite assurée = le contrat ; aucun facteur du plan ne designe une autre
#   entite. Convention canonique `id_contrat` (12 synonymes reconnus).
identifiant_contrat: id_contrat
#
# ⚠️ LA CLE COMPLETE EST (identifiant, echeance). Sans echeance, deux lignes de
# meme identifiant sont AMBIGUES — doublon, ou HISTORIQUE de renouvellement ?
# Mesure : un historique sur 3 exercices porte 66,7 % de faux doublons. Elles
# sont alors CONSERVEES et signalees, jamais exclues.
# ⚠️ Declarer la colonne ici ne l'exige pas du client : si elle est absente du
# fichier, le systeme le DIT et conserve les lignes. Mesure : aucune fausse
# amputation du plan.
echeance: date_echeance
# ══════════════════════════════════════════════════════════════════════════════
famille_severite: gamma
facteurs:
  - {nom: age,                       type: continu, transformation: carre}
  - {nom: bonus_malus,               type: continu}
  - {nom: anciennete_permis,         type: continu}
  - {nom: puissance_fiscale,         type: continu}
  - {nom: age_vehicule,              type: continu}
  - {nom: valeur_venale,             type: continu, transformation: log}
  - nom: garantie
    type: categoriel
    encodage: one_hot
    modalites: [Tiers, TousRisques]
    reference: Tiers
  - nom: carburant
    type: categoriel
    encodage: one_hot
    modalites: [Essence, Diesel, Electrique]
    reference: Essence
  # CORRECTIF DE MODELISATION (encodage errone, meme classe que secteur_activite) :
  # csp est NOMINALE. En label [Cadre=0,Employe=1,Retraite=2] le GLM INVERSAIT le
  # classement (Employe, le plus risque, sortait moins risque que Cadre). Passee en
  # ONE_HOT -> chaque CSP a sa relativite. Verite terrain : Employe > Cadre > Retraite.
  - nom: csp
    type: categoriel
    encodage: one_hot
    modalites: [Cadre, Employe, Retraite]
    reference: Cadre
  - nom: usage
    type: categoriel
    encodage: label
    modalites: [Prive, Pro]
  - {nom: antecedents_sinistres_n1,  type: continu, anteriorite: true,
     commentaire: "Connue a la souscription — exemptee du controle par l'effet"}
  # ── Colonnes DÉRIVÉES, calculées automatiquement par A2 (mêmes formules que
  # l'ancien _feature_engineering). Le plan les déclare comme facteurs ordinaires :
  # il n'a pas à savoir COMMENT elles sont calculées, seulement qu'elles existent.
  - {nom: jeune_conducteur,          type: binaire, commentaire: "A2 : age < 25"}
  - {nom: senior_conducteur,         type: binaire, commentaire: "A2 : age > 70"}
  - {nom: vehicule_recent,           type: binaire, commentaire: "A2 : age_vehicule < 3"}
  - {nom: vehicule_ancien,           type: binaire, commentaire: "A2 : age_vehicule > 10"}
  - {nom: risque_historique,         type: continu,
     commentaire: "A2 : bonus_malus * (1 + antecedents_sinistres_n1)"}
  - {nom: km_par_an_normalise,       type: continu,
     commentaire: "A2 : kilometrage_annuel / max(exposition, 0.01)"}
  # ── Milieu géographique : label ordinaire (source client, comme csp/usage).
  - nom: milieu_geographique
    type: categoriel
    encodage: label
    modalites: [Urbain, Periurbain, Rural]
interactions:
  - [age, bonus_malus]

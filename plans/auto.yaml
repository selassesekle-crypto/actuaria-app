# ActuarIA — Plan de tarification AUTO. Reproduit l'ancienne config codée en dur
# (VARS_GLM / VARS_CATEGORIELLES / INTERACTIONS) en UNE SEULE déclaration signée.
lob: auto
version: "1.0"
auteur: "S. Sekle, IA"
exposition: exposition
cible_frequence: nb_sinistres
cible_cout: cout_total_sinistres
famille_severite: gamma
facteurs:
  - {nom: age,                       type: continu, transformation: carre}
  - {nom: bonus_malus,               type: continu}
  - {nom: anciennete_permis,         type: continu}
  - {nom: puissance_fiscale,         type: continu}
  - {nom: age_vehicule,              type: continu}
  - {nom: valeur_venale,             type: continu, transformation: log}
  - nom: garantie
    type: categoriel
    encodage: one_hot
    modalites: [Tiers, TousRisques]
    reference: Tiers
  - nom: carburant
    type: categoriel
    encodage: one_hot
    modalites: [Essence, Diesel, Electrique]
    reference: Essence
  - nom: csp
    type: categoriel
    encodage: label
    modalites: [Cadre, Employe, Retraite]
  - nom: usage
    type: categoriel
    encodage: label
    modalites: [Prive, Pro]
  - {nom: antecedents_sinistres_n1,  type: continu, anteriorite: true,
     commentaire: "Connue a la souscription — exemptee du controle par l'effet"}
  # ── Colonnes DÉRIVÉES, calculées automatiquement par A2 (mêmes formules que
  # l'ancien _feature_engineering). Le plan les déclare comme facteurs ordinaires :
  # il n'a pas à savoir COMMENT elles sont calculées, seulement qu'elles existent.
  - {nom: jeune_conducteur,          type: binaire, commentaire: "A2 : age < 25"}
  - {nom: senior_conducteur,         type: binaire, commentaire: "A2 : age > 70"}
  - {nom: vehicule_recent,           type: binaire, commentaire: "A2 : age_vehicule < 3"}
  - {nom: vehicule_ancien,           type: binaire, commentaire: "A2 : age_vehicule > 10"}
  - {nom: risque_historique,         type: continu,
     commentaire: "A2 : bonus_malus * (1 + antecedents_sinistres_n1)"}
  - {nom: km_par_an_normalise,       type: continu,
     commentaire: "A2 : kilometrage_annuel / max(exposition, 0.01)"}
  # ── Milieu géographique : label ordinaire (source client, comme csp/usage).
  - nom: milieu_geographique
    type: categoriel
    encodage: label
    modalites: [Urbain, Periurbain, Rural]
interactions:
  - [age, bonus_malus]

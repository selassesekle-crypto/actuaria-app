# ══════════════════════════════════════════════════════════════════════════════
# ActuarIA — GATES RAPIDES, a chaque push
#
# CE QUE CE FICHIER VERIFIE, ET CE QU'IL NE VERIFIE PAS :
#   OUI  normes . core . pytest Vie/EP-RE + Sante-Prevoyance   = 521 tests
#   NON  direction_non_vie -> workflow nocturne separe
#
# /!\ LE COMPTE DE LA ZONE NON COUVERTE N'EST PLUS ECRIT. Cette ligne annoncait
#     << 1 128 tests >> ; la nocturne du 28/08/2026 en a execute 1 610. Un
#     compte qu'on ne LANCE PAS ici ne peut pas etre derive ici : ce ne peut
#     donc etre qu'une affirmation, et une affirmation se perime. Ce que cette
#     phrase doit dire est ce qu'elle LIMITE -- la zone n'est pas verifiee --
#     et cela reste vrai sans aucun nombre.
#
# /!\ IL NE DOIT JAMAIS AFFIRMER PLUS QU'IL N'A VERIFIE. Le resume nomme les
#     zones executees ET LE NOMBRE DE TESTS de chacune. Un vert sans compte est
#     ce qui a permis a 36 tests de ne jamais tourner tout en rendant << OK >>.
#
# POURQUOI CE DECOUPAGE : mesure locale, `direction_non_vie` prend 23 a 26 min
# et pese 90,9 % de son temps dans `provisionnement` seul -- paralleliser ne
# donnerait rien. Attendre 30-45 min pour savoir si un push est bon est trop
# lent ; 521 tests en moins de cinq minutes attrapent la majorite des
# regressions, et le reste suit dans la nuit.
#
# /!\ AUCUNE CLE N'ENTRE ICI, ET C'EST VERIFIE AU DEMARRAGE. Le depot est
#     PUBLIC : ces journaux le sont aussi. La garantie la plus forte n'est pas
#     la discretion, c'est l'ABSENCE -- on ne caviarde pas ce qui n'est jamais
#     entre. Meme raisonnement que le lot C2 sur l'apercu client.
# ══════════════════════════════════════════════════════════════════════════════
name: "Gates rapides"

on:
  push:
  pull_request:
  workflow_dispatch:

# /!\ LECTURE SEULE. Le robot de donnees marche pouvait committer sur `main` ;
# aucun workflow de ce depot ne doit plus pouvoir ecrire.
permissions:
  contents: read

jobs:
  gates-rapides:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Parite avec le poste de developpement (mesure : py 3.14.3).
      PYTHONUTF8: "1"
      PYTHONPATH: "."

    steps:
      - name: "Recuperer le depot"
        uses: actions/checkout@v5

      - name: "Python 3.14 — la version REELLEMENT utilisee"
        # /!\ PAS 3.11. Certifier une version que personne n'utilise ne prouve
        # rien. Si 3.14 est indisponible, ce pas ECHOUE -- c'est voulu : mieux
        # vaut une CI rouge qu'une CI qui teste autre chose en silence.
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: "/!\\ Verifier qu'AUCUNE cle n'est presente"
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY est presente. Les journaux de ce"
            echo "::error::depot PUBLIC pourraient la faire fuir. La CI ne doit"
            echo "::error::pas la porter : les tests sont concus sans elle."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY absente : aucune fuite possible par les journaux."

      - name: "Installer la pile COEUR seule"
        # /!\ AUCUN PAQUET OPTIONNEL ICI, ET C'EST MESURE : les douze fichiers
        # de test qui en dependent vivent TOUS dans `direction_non_vie`, hors
        # de ce workflow. Les quatre zones du trio n'ont zero import direct de
        # xgboost / lightgbm / catboost / torch / shap / optuna / kaleido.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # `pytest-xdist` sert le `-n 6` de la gate 3 : la commande de CI
          # est ALORS IDENTIQUE a la gate locale, ce qui vaut mieux que
          # gagner quelques secondes avec une autre.
          pip install pytest pytest-xdist

      - name: "Gate 1/3 — normes"
        id: normes
        run: |
          set +e
          python -m unittest discover -s normes -t . > /tmp/normes.txt 2>&1
          code=$?
          set -e
          # /!\ LE CODE DE SORTIE EST CAPTURE ICI, avant toute autre commande :
          # piper une gate dans `tail` ferait rendre le code de `tail`.
          n=$(grep -oE '^Ran [0-9]+ test' /tmp/normes.txt | grep -oE '[0-9]+')
          n=${n:-0}
          echo "tests=$n" >> "$GITHUB_OUTPUT"
          # /!\ NE PAS se contenter de `tail` : les `print` stdout sont
          # bufferises et vides EN FIN, APRES les tracebacks stderr -- un tail
          # ne montre alors que des lignes vertes sur une gate ROUGE. C'est cet
          # angle mort qui a cache pyyaml des jours. On surface les echecs.
          if [ "$code" -ne 0 ]; then
            echo "===== ECHECS (blocs FAIL/ERROR + traceback stderr) ====="
            # /!\ NE PAS TRONQUER EN SILENCE : une sortie coupee sans le dire
            # est indiscernable d'une sortie complete -- le lecteur croit avoir
            # tout vu. On borne (un log n'est pas infini) et ON DECLARE.
            awk '/^={20,}/{f=1} f' /tmp/normes.txt > /tmp/echecs_normes.txt
            _tot=$(wc -l < /tmp/echecs_normes.txt)
            head -300 /tmp/echecs_normes.txt
            if [ "$_tot" -gt 300 ]; then
              echo "----- SORTIE TRONQUEE : $_tot lignes d'echec, 300 affichees,"
              echo "----- $((_tot - 300)) MASQUEES. Relancer en local pour le reste."
            else
              echo "----- sortie COMPLETE : $_tot ligne(s) d'echec, aucune masquee."
            fi
          fi
          tail -20 /tmp/normes.txt
          exit $code

      - name: "Gate 2/3 — core"
        id: core
        run: |
          set +e
          python -m unittest discover -s core -t . > /tmp/core.txt 2>&1
          code=$?
          set -e
          n=$(grep -oE '^Ran [0-9]+ test' /tmp/core.txt | grep -oE '[0-9]+')
          n=${n:-0}
          echo "tests=$n" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "===== ECHECS (blocs FAIL/ERROR + traceback stderr) ====="
            # /!\ NE PAS TRONQUER EN SILENCE : une sortie coupee sans le dire
            # est indiscernable d'une sortie complete -- le lecteur croit avoir
            # tout vu. On borne (un log n'est pas infini) et ON DECLARE.
            awk '/^={20,}/{f=1} f' /tmp/core.txt > /tmp/echecs_core.txt
            _tot=$(wc -l < /tmp/echecs_core.txt)
            head -300 /tmp/echecs_core.txt
            if [ "$_tot" -gt 300 ]; then
              echo "----- SORTIE TRONQUEE : $_tot lignes d'echec, 300 affichees,"
              echo "----- $((_tot - 300)) MASQUEES. Relancer en local pour le reste."
            else
              echo "----- sortie COMPLETE : $_tot ligne(s) d'echec, aucune masquee."
            fi
          fi
          tail -20 /tmp/core.txt
          exit $code

      - name: "Gate 3/3 — pytest Vie/EP-RE + Sante-Prevoyance"
        id: pytest
        run: |
          set +e
          python -m pytest direction_vie_epre direction_sante_prevoyance \
            -q -n 6 --dist loadfile > /tmp/pytest.txt 2>&1
          code=$?
          set -e
          n=$(grep -oE '[0-9]+ passed' /tmp/pytest.txt | grep -oE '[0-9]+' | head -1)
          n=${n:-0}
          f=$(grep -oE '[0-9]+ failed' /tmp/pytest.txt | grep -oE '[0-9]+' | head -1)
          f=${f:-0}
          echo "tests=$n" >> "$GITHUB_OUTPUT"
          echo "echecs=$f" >> "$GITHUB_OUTPUT"
          tail -25 /tmp/pytest.txt
          exit $code

      - name: "Resume — CE QUI A ETE VERIFIE, ET RIEN DE PLUS"
        if: always()
        run: |
          {
            echo "## Gates rapides"
            echo ""
            echo "| zone | tests executes |"
            echo "|---|---|"
            echo "| normes | ${{ steps.normes.outputs.tests }} |"
            echo "| core | ${{ steps.core.outputs.tests }} |"
            echo "| pytest Vie/EP-RE + Sante-Prev. | ${{ steps.pytest.outputs.tests }} passes, ${{ steps.pytest.outputs.echecs }} echoues |"
            echo ""
            echo "**NON VERIFIE ICI : \`direction_non_vie\`.**"
            echo "Ce workflow ne couvre pas la plus grosse zone du depot —"
            echo "elle tourne dans le workflow nocturne. Un vert ici ne dit"
            echo "rien d'A7, de la tarification ni de la reglementation Non-Vie."
            echo ""
            echo "Cle API : absente (verifie au demarrage)."
            echo "Paquets optionnels : non installes, aucun test du trio n'en depend."
          } >> "$GITHUB_STEP_SUMMARY"
